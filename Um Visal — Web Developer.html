    rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 80px
    }

    body {
      background: #05030a;
      color: #e7e9f0;
      font-family: Sora, "Noto Sans Khmer", system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow-x: hidden
    }

    .serif {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400
    }

    html[data-theme=light] {
      filter: invert(1) hue-rotate(180deg)
    }

    html[data-theme=light] canvas,
    html[data-theme=light] img {
      filter: invert(1) hue-rotate(180deg)
    }

    .grad {
      background: linear-gradient(90deg, #c4b5fd, #a78bfa, #e879f9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .card {
      background: rgba(255, 255, 255, .035);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 1.25rem;
      backdrop-filter: blur(6px)
    }

    .glow {
      position: absolute;
      border-radius: 9999px;
      filter: blur(110px);
      opacity: .25;
      pointer-events: none
    }

    .inp {
      width: 100%;
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: .75rem;
      padding: .8rem 1rem;
      outline: none;
      color: #fff
    }

    .inp:focus {
      border-color: #a78bfa
    }

    .tilt {
      background-image: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255, 255, 255, .09), transparent 45%)
    }

    .tilt.tilt {
      transition: transform .18s ease-out, border-color .2s;
      transform-style: preserve-3d;
      will-change: transform
    }

    .tilt > * {
      transform-style: preserve-3d;
      transform: translateZ(12px);
    }

    .mag.mag {
      transition: translate .2s ease-out, background-color .2s
    }

    .mq {
      animation: mq 38s linear infinite
    }

    .mq.rev {
      animation-direction: reverse;
      animation-duration: 46s
    }

    .mq:hover {
      animation-play-state: paused
    }

    @keyframes mq {
      to {
        transform: translateX(-50%)
      }
    }

    .holo {
      filter: grayscale(.3) sepia(1) hue-rotate(185deg) saturate(3.4) contrast(1.15) brightness(.95);
      transition: filter .7s
    }

    .holo.nat {
      filter: none
    }

    .scan {
      background: repeating-linear-gradient(0deg, rgba(0, 20, 60, .28) 0 1px, transparent 1px 3px);
      mix-blend-mode: multiply;
      transition: opacity .5s
    }

    .sweep {
      top: -20%;
      background: linear-gradient(180deg, transparent, rgba(120, 220, 255, .35), transparent);
      animation: sw 3.2s linear infinite;
      transition: opacity .5s
    }

    @keyframes sw {
      to {
        top: 110%
      }
    }

    .fx-orb {
      position: fixed;
      top: 0;
      left: 0;
      width: 26px;
      height: 26px;
      margin: -13px 0 0 -13px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 9998;
      display: none;
      background: radial-gradient(circle at 35% 30%, #fff, #d8a8ff 45%, #8b5cf6);
      box-shadow: 0 0 30px 6px rgba(167, 139, 250, .55)
    }

    @media (pointer:fine) {
      html.fx-on .fx-orb {
        display: block
      }
    }

    .spin-slow {
      animation: sp 14s linear infinite
    }

    @keyframes sp {
      to {
        transform: rotate(360deg)
      }
    }

    .chip-pulse {
      animation: cp 2.6s ease-out infinite
    }

    @keyframes cp {
      0% {
        transform: scale(.9);
        opacity: .9
      }

      100% {
        transform: scale(2);
        opacity: 0
      }
    }

    .flow {
      background: linear-gradient(90deg, transparent, #c4b5fd, transparent);
      animation: fl 3.4s ease-in-out infinite
    }

    @keyframes fl {
      0% {
        left: 0;
        opacity: 0
      }

      15% {
        opacity: 1
      }

      85% {
        opacity: 1
      }

      100% {
        left: calc(100% - 6rem);
        opacity: 0
      }
    }

    .kb {
      animation: kb 7s ease-in-out infinite alternate
    }

    @keyframes kb {
      from {
        transform: scale(1)
      }

      to {
        transform: scale(1.07)
      }
    }

    .fx-spot {
      position: fixed;
      inset: 0;
      z-index: 45;
      pointer-events: none;
      background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 30%), rgba(167, 139, 250, .13), transparent 60%)
    }

    .fx-ring,
    .fx-dot {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 9999;
      border-radius: 9999px;
      display: none
    }

    .fx-ring {
      width: 38px;
      height: 38px;
      margin: -19px 0 0 -19px;
      border: 1.5px solid rgba(196, 181, 253, .75);
      transition: scale .2s
    }

    .fx-dot {
      width: 7px;
      height: 7px;
      margin: -3.5px 0 0 -3.5px;
      background: #c4b5fd;
      box-shadow: 0 0 12px #a78bfa
    }

    @media (pointer:fine) {

      html.fx-on .fx-ring,
      html.fx-on .fx-dot {
        display: block
      }

      html.fx-on,
      html.fx-on * {
        cursor: none !important
      }
    }
  </style>
</head>

    const Reveal = ({ children, d = 0, cls = "" }) => html`<${motion.div} className=${cls} initial=${{ opacity: 0, y: 36 }} whileInView=${{ opacity: 1, y: 0 }} viewport=${{ once: true, margin: "-60px" }} transition=${{ duration: .65, delay: d, ease: "easeOut" }}>${children}<//>`;
    const Head = ({ k, t, s }) => html`<${Reveal} cls="text-center mb-14"><p class="text-violet-400 text-sm tracking-[.25em] uppercase mb-3">${k}</p><h2 class="serif text-4xl md:text-6xl">${t}</h2><p class="text-slate-400 mt-4 max-w-xl mx-auto">${s}</p><//>`;
    const Sec = ({ id, children, cls = "" }) => html`<section id=${id} class=${"relative py-24 px-5 " + cls}><div class="max-w-6xl mx-auto">${children}</div></section>`;

    function Nav({ lang, setLang, light, setLight }) {
      const [open, setOpen] = useState(false), [act, setAct] = useState("home");
      useEffect(() => { const f = () => { let c = "home"; NAV.forEach(([_, id]) => { const e = document.getElementById(id); if (e && e.getBoundingClientRect().top < 140) c = id }); setAct(c) }; f(); addEventListener("scroll", f); return () => removeEventListener("scroll", f) }, []);
      const go = id => { setOpen(false); document.getElementById(id)?.scrollIntoView({ behavior: "smooth" }) };
      const link = (n, id, c) => html`<a key=${id} href=${"#" + id} onClick=${e => { e.preventDefault(); go(id) }} class=${c + (act === id ? " text-white" : " text-slate-400 hover:text-white")}>${n}</a>`;
      return html`<header class="fixed top-0 inset-x-0 z-50 px-3 sm:px-5" style=${{ paddingTop: "calc(env(safe-area-inset-top,0px) + 14px)" }}>
    <div class="max-w-6xl mx-auto rounded-full border border-white/10 bg-black/55 backdrop-blur-xl h-[60px] px-5 sm:px-7 flex items-center justify-between">
      <a href="#home" onClick=${e => { e.preventDefault(); go("home") }} class="font-bold text-lg sm:text-xl">Um Visal</a>
      <nav class="hidden lg:flex gap-8 text-[15px]">${NAV.slice(1).map(([n, id]) => link(n, id, "transition"))}</nav>
      <div class="flex items-center gap-2">
        <button onClick=${() => setLang(lang === "en" ? "km" : "en")} class="h-10 px-4 rounded-full bg-white/10 text-sm font-semibold hover:bg-white/20">${lang === "en" ? "EN" : "KH"}</button>
        <button aria-label="Theme" onClick=${() => setLight(!light)} class="w-10 h-10 rounded-full bg-white/10 grid place-items-center hover:bg-white/20">${light ? html`<${L.Moon} size=${18}/>` : html`<${L.Sun} size=${18}/>`}</button>
        <button aria-label="Menu" class="lg:hidden w-10 h-10 rounded-full bg-white/10 grid place-items-center" onClick=${() => setOpen(!open)}>${open ? html`<${L.X} size=${18}/>` : html`<${L.Menu} size=${18}/>`}</button>
      </div>
    </div>
    <${AnimatePresence}>${open && html`<${motion.nav} key="m" initial=${{ opacity: 0, y: -10 }} animate=${{ opacity: 1, y: 0 }} exit=${{ opacity: 0, y: -10 }} class="lg:hidden max-w-6xl mx-auto mt-2 rounded-3xl border border-white/10 bg-black/85 backdrop-blur-xl p-3 flex flex-col">${NAV.map(([n, id]) => link(n, id, "px-4 py-3 rounded-2xl"))}<//>`}<//>
  </header>`;

              <span class="truncate max-w-[280px] sm:max-w-md">${phase}</span>
            </div>
            <div class="text-2xl sm:text-3xl font-bold font-mono grad tabular-nums">${String(prog).padStart(2, '0')}%</div>
          </div>
          <div class="h-2 rounded-full bg-white/10 p-0.5 overflow-hidden border border-white/10 relative">
            <div class="h-full rounded-full bg-gradient-to-r from-sky-400 via-violet-500 to-fuchsia-500 transition-all duration-75 relative" style=${{ width: prog + "%", boxShadow: "0 0 16px rgba(168,85,247,0.8)" }}>
              <span class="absolute right-0 top-0 bottom-0 w-3 bg-white rounded-full animate-pulse"></span>
            </div>
          </div>
          <div class="flex justify-between items-center text-[10px] text-slate-500 font-mono mt-3">
            <span>LATENCY: 12ms · 60 FPS</span>
            <div class="flex items-center gap-1">${Array.from({length: 12}).map((_, i) => html`<span key=${i} class="w-1 bg-cyan-400/60 rounded-full animate-pulse" style=${{ height: (4 + (i * 3 % 10)) + 'px', animationDelay: (i * 0.1) + 's' }}></span>`)}</div>
            <span>MEMORY: 128MB / 3D LOADED</span>
          </div>
        </div>
      </div>`;
    }

    function Cosmic3DBackground() {
      const ref = useRef(null);
      useEffect(() => {
        const T = window.THREE; if (!T) return;
        const el = ref.current; if (!el) return;
        let r;
        try { r = new T.WebGLRenderer({ alpha: true, antialias: true }) } catch (e) { return }
        r.setPixelRatio(Math.min(devicePixelRatio, 1.5));
        el.appendChild(r.domElement);

        const sc = new T.Scene(), cam = new T.PerspectiveCamera(50, 1, 0.1, 100);
        cam.position.set(0, 0, 15);
        const group = new T.Group(); sc.add(group);

        const mats = [
          new T.MeshBasicMaterial({ color: 0x8b5cf6, wireframe: true, transparent: true, opacity: 0.35 }),
          new T.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.3 }),
          new T.MeshBasicMaterial({ color: 0xec4899, wireframe: true, transparent: true, opacity: 0.25 })
        ];
        const geos = [
          new T.OctahedronGeometry(0.7),
          new T.IcosahedronGeometry(0.65),
          new T.TetrahedronGeometry(0.7),
          new T.TorusGeometry(0.5, 0.1, 6, 16)
        ];

        const meshes = [];
        for (let i = 0; i < 22; i++) {
          const g = geos[i % geos.length];
          const m = mats[i % mats.length];
          const mesh = new T.Mesh(g, m);
          mesh.position.set((Math.random() - 0.5) * 28, (Math.random() - 0.5) * 35, (Math.random() - 0.5) * 15 - 2);
          mesh.userData = { rx: (Math.random() - 0.5) * 0.02, ry: (Math.random() - 0.5) * 0.02, speedY: 0.006 + Math.random() * 0.01, startY: mesh.position.y };
          group.add(mesh);
          meshes.push(mesh);
        }

        const N = 350, pos = new Float32Array(N * 3);
        for (let i = 0; i < N * 3; i += 3) {
          pos[i] = (Math.random() - 0.5) * 40;
          pos[i + 1] = (Math.random() - 0.5) * 40;
          pos[i + 2] = (Math.random() - 0.5) * 20 - 5;
        }
        const bgGeo = new T.BufferGeometry();
        bgGeo.setAttribute("position", new T.BufferAttribute(pos, 3));
        const bgPts = new T.Points(bgGeo, new T.PointsMaterial({ size: 0.06, color: 0xc4b5fd, transparent: true, opacity: 0.5, blending: T.AdditiveBlending }));
        sc.add(bgPts);

        let mx = 0, my = 0;
        const onMove = e => { mx = (e.clientX / innerWidth - 0.5) * 2; my = (e.clientY / innerHeight - 0.5) * 2; };
        addEventListener("pointermove", onMove);

        const resize = () => {
          const w = window.innerWidth, h = window.innerHeight;
          r.setSize(w, h);
          cam.aspect = w / h;
          cam.updateProjectionMatrix();
        };
        resize();
        addEventListener("resize", resize);

        let raf;
        const loop = () => {
          raf = requestAnimationFrame(loop);
          const sy = window.scrollY || 0;
          cam.position.y = -sy * 0.003;
          group.rotation.y += ((mx * 0.15) - group.rotation.y) * 0.03;
          group.rotation.x += ((-my * 0.15) - group.rotation.x) * 0.03;

          meshes.forEach(m => {
            m.rotation.x += m.userData.rx;
            m.rotation.y += m.userData.ry;
            m.position.y += m.userData.speedY;
            if (m.position.y > m.userData.startY + 15) m.position.y = m.userData.startY - 15;
          });
          r.render(sc, cam);
        };
        loop();

        return () => {
          cancelAnimationFrame(raf);
          removeEventListener("pointermove", onMove);
          removeEventListener("resize", resize);
          r.dispose();
          el.innerHTML = "";
        };
      }, []);
      return html`<div ref=${ref} class="fixed inset-0 pointer-events-none z-0"></div>`;
    }

    function App() {
      const [loading, setLoading] = useState(true);
      const [p, setP] = useState(0), [top, setTop] = useState(false), [lang, setLang] = useState("en"), [light, setLight] = useState(false);
      useEffect(() => { document.documentElement.dataset.theme = light ? "light" : "dark" }, [light]);
      useEffect(() => { const f = () => { const m = document.documentElement.scrollHeight - innerHeight; setP(m > 0 ? scrollY / m : 0); setTop(scrollY > 600) }; addEventListener("scroll", f); return () => removeEventListener("scroll", f) }, []);
      return html`<div>
        <${AnimatePresence}>
          ${loading && html`<${motion.div} key="loader" initial=${{ opacity: 1 }} exit=${{ opacity: 0, scale: 1.05 }} transition=${{ duration: .8, ease: "easeInOut" }} class="fixed inset-0 z-[120]"><${Loader3D} onComplete=${() => setLoading(false)}/><//>`}
        <//>
        <div class="fixed top-0 left-0 h-[3px] z-[60] bg-gradient-to-r from-violet-400 via-sky-400 to-violet-500" style=${{ width: p * 100 + "%" }}></div>
        <${Cosmic3DBackground}/>
        <${FX}/>
        <${Nav} lang=${lang} setLang=${setLang} light=${light} setLight=${setLight}/>
        <main><${Hero} lang=${lang}/><${About}/><${Pillars}/><${Experience}/><${Marquee}/><${Skills}/><${Projects}/><${Education}/><${Contact}/></main>
        <${Footer}/>
        <${AnimatePresence}>${top && html`<${motion.button} key="t" aria-label="Back to top" initial=${{ opacity: 0, scale: .6 }} animate=${{ opacity: 1, scale: 1 }} exit=${{ opacity: 0, scale: .6 }} onClick=${() => scrollTo({ top: 0, behavior: "smooth" })} class="fixed bottom-6 right-6 z-50 w-12 h-12 rounded-full bg-violet-400 text-black grid place-items-center shadow-lg"><${L.ArrowUp}/><//>`}<//>
      </div>`;
    }
    ReactDOM.createRoot(document.getElementById("root")).render(h(App));
  </script>
